<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>実況スレ — peca-p2p-yp</title>
  <style>
    /* --- 旧来 2ch 風スキン(T011 — 参考画像 _alt 相当・外部アセット参照なし) --- */
    /* レンガ調背景は繰り返しグラデーション(CSS のみ)で再現する。 */
    html { background: #efefef; }
    body {
      font-family: "MS PGothic", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
      margin: 0;
      color: #000;
      background-color: #c9c19f;
      /* レンガ調: 目地(縦横)+ 段ごとのオフセットを繰り返しグラデーションで表現。 */
      background-image:
        repeating-linear-gradient(0deg,   rgba(120,90,60,0.35) 0 2px, transparent 2px 26px),
        repeating-linear-gradient(90deg,  rgba(120,90,60,0.30) 0 2px, transparent 2px 60px),
        linear-gradient(180deg, #cdb488, #c3a878);
      background-attachment: fixed;
    }
    .wrap { max-width: 900px; margin: 0 auto; padding: 0.6rem 0.8rem 2rem; }
    a { color: #0000ee; }
    a:visited { color: #551a8b; }
    .topnav { font-size: 0.85rem; margin: 0.2rem 0 0.6rem; }
    .hidden, [hidden] { display: none !important; }

    /* 緑帯(板/スレのタイトル) — 伝統的な 2ch の緑ヘッダ。 */
    .titlebar {
      background: linear-gradient(180deg, #0a5c0a, #084008);
      color: #fff;
      font-weight: bold;
      font-size: 1.15rem;
      padding: 0.35rem 0.6rem;
      border: 1px solid #063006;
      border-radius: 2px;
      text-shadow: 0 1px 0 #000;
    }
    .subbar { font-size: 0.8rem; color: #333; margin: 0.2rem 0 0.6rem; }

    /* 本文カラム(掲示板の“紙”部分) */
    .paper { background: #efefef; border: 1px solid #b0a070; padding: 0.6rem 0.8rem; border-radius: 2px; }

    .rules {
      background: #ffffe8; border: 1px solid #cfcf9a; padding: 0.4rem 0.7rem;
      margin: 0.5rem 0; font-size: 0.9rem; border-radius: 2px;
    }
    .rules h1, .rules h2, .rules h3 { font-size: 1rem; margin: 0.3rem 0; color: #700; }
    .rules a { color: #0000ee; }

    /* スレ一覧 */
    ol.threadlist { margin: 0.4rem 0; padding-left: 1.6rem; }
    ol.threadlist li { margin: 0.15rem 0; }
    ol.threadlist a { color: #0000ee; text-decoration: none; }
    ol.threadlist a:hover { text-decoration: underline; }
    .rescount { color: #007000; font-weight: bold; }

    /* 板選択 */
    ul.boardlist { list-style: none; margin: 0.4rem 0; padding: 0; }
    ul.boardlist li { padding: 0.25rem 0; border-bottom: 1px dotted #b0a070; }
    .badge-local { color: #060; font-weight: bold; }
    .badge-remote { color: #46c; font-weight: bold; }

    /* レス列(伝統形式) */
    .res { margin: 0.35rem 0 0.6rem; }
    .res-head { color: #000; font-size: 0.9rem; }
    .res-no { color: #008000; font-weight: bold; margin-right: 0.2rem; }
    .res-name { color: #008000; font-weight: bold; }
    .res-mail { color: #0000ee; }
    .res-date { color: #333; }
    .res-body { margin: 0.2rem 0 0.2rem 1.6rem; line-height: 1.5; font-size: 0.95rem; word-break: break-word; }
    .res-pending .res-body { color: #b06000; font-style: italic; }
    .anchor { color: #0000ee; text-decoration: underline; cursor: pointer; }
    .anchor.dead { color: #b00; text-decoration: line-through; cursor: help; }

    /* アンカーのインラインポップアップ */
    .popup {
      position: absolute; z-index: 50; max-width: 460px;
      background: #ffffe0; border: 1px solid #a09030; box-shadow: 2px 2px 6px rgba(0,0,0,0.35);
      padding: 0.35rem 0.5rem; font-size: 0.88rem; border-radius: 2px;
    }
    .popup .res-body { margin-left: 0.4rem; }

    /* フォーム類 */
    .writebox { background: #fffde8; border: 1px solid #cfcf9a; padding: 0.5rem 0.7rem; margin: 0.8rem 0; border-radius: 2px; }
    .row { margin: 0.3rem 0; }
    label { display: inline-block; min-width: 5.5rem; font-size: 0.9rem; }
    input, textarea, select { font: inherit; font-size: 0.9rem; }
    textarea { width: 100%; box-sizing: border-box; }
    button { cursor: pointer; font-size: 0.85rem; }
    .toolbar { margin: 0.4rem 0; }
    .toolbar button { margin-right: 0.3rem; }
    .muted { color: #666; font-size: 0.85rem; }
    .err { color: #b00; }
    .ok { color: #060; }
    .board-url { font-family: monospace; background: #f0f0e0; padding: 0.15rem 0.4rem; border: 1px solid #cfcf9a; }
    details { margin: 0.4rem 0; background: #f4f4e4; border: 1px solid #cfcf9a; border-radius: 2px; padding: 0.2rem 0.5rem; }
    summary { cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    .banner { padding: 0.5rem 0.8rem; margin-bottom: 0.6rem; border-radius: 2px; }
    .banner-warn { background: #fff3cd; border: 1px solid #b06000; color: #663c00; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topnav"><a href="/index.html">&larr; トップ</a></div>

    <div id="disabled-banner" class="banner banner-warn" hidden>
      スレ機能が無効(livechat_enabled=false)か、供給元が未配線です。設定を確認してください。
    </div>

    <!-- ============ ビュー1: 板選択(#/) ============ -->
    <section id="view-home" hidden>
      <div class="titlebar">実況スレ(配信実況掲示板)</div>
      <div class="subbar">板を選ぶ / 配信者はスレを開設する</div>

      <div class="paper">
        <!-- スレ開設(掲載中チャンネルのペルソナが配信者としてスレを立てる) -->
        <details open>
          <summary>スレを開設する(配信者)</summary>
          <div class="row">
            <label for="open-channel">チャンネル</label>
            <select id="open-channel"><option value="">— 掲載中チャンネルを選択 —</option></select>
          </div>
          <div class="row">
            <label for="open-title">タイトル</label>
            <input id="open-title" type="text" size="36" placeholder="実況スレ">
          </div>
          <div class="row">
            <button id="open-btn">スレを開設</button>
            <span id="open-status" class="muted"></span>
          </div>
        </details>

        <h3 style="margin:0.6rem 0 0.2rem;font-size:1rem;">板一覧</h3>
        <div id="home-status" class="muted">読み込み中...</div>
        <ul class="boardlist" id="board-list"></ul>
      </div>
    </section>

    <!-- ============ ビュー2: 板ページ(#/board/{id}) ============ -->
    <section id="view-board" hidden>
      <div class="topnav"><a href="#/">&larr; 板一覧へ</a></div>
      <div class="titlebar" id="board-title">板</div>
      <div class="subbar"><span id="board-badge"></span> <span id="board-idlabel" class="muted"></span></div>

      <div class="paper">
        <div id="board-rules-wrap" class="rules" hidden>
          <div class="muted">ローカルルール</div>
          <div id="board-rules"></div>
        </div>

        <div class="row" id="board-url-wrap" hidden>
          専ブラ向け板 URL: <span class="board-url" id="board-url"></span>
          <button id="copy-url-btn">コピー</button>
        </div>

        <h3 style="margin:0.6rem 0 0.2rem;font-size:1rem;">スレ一覧</h3>
        <div id="board-status" class="muted"></div>
        <ol class="threadlist" id="thread-list"></ol>

        <details id="newthread-wrap" hidden>
          <summary>新規スレを作成する(配信者)</summary>
          <div class="row">
            <label for="nt-title">タイトル</label>
            <input id="nt-title" type="text" size="36" placeholder="実況スレ">
          </div>
          <div class="row">
            <button id="nt-btn">作成</button>
            <span id="nt-status" class="muted"></span>
          </div>
        </details>
      </div>
    </section>

    <!-- ============ ビュー3: スレページ(#/thread/{id}/{key}) ============ -->
    <section id="view-thread" hidden>
      <div class="topnav"><a href="#/" id="thread-back">&larr; 板一覧へ</a></div>
      <div class="titlebar" id="thread-title">スレ</div>
      <div class="subbar"><span id="thread-badge"></span></div>

      <div class="toolbar">
        <button id="refresh-btn">更新</button>
        <button id="view-l50-btn">最新50</button>
        <button id="view-all-btn">全部読む</button>
        <span id="thread-range" class="muted"></span>
      </div>

      <div class="paper">
        <div id="res-list"></div>
      </div>

      <!-- 書き込み欄 -->
      <div class="writebox">
        <div class="row"><label for="w-name">名前</label><input id="w-name" type="text" size="20"></div>
        <div class="row"><label for="w-mail">メール</label><input id="w-mail" type="text" size="20"></div>
        <div class="row"><textarea id="w-body" rows="3" placeholder="本文(必須)"></textarea></div>
        <div class="row"><button id="write-btn">書き込む</button> <span id="write-status" class="muted"></span></div>
      </div>

      <!-- 管理操作(既存機能の温存 — 折りたたみ) -->
      <details>
        <summary>スレ操作(配信者・参加者)</summary>
        <div class="toolbar">
          <button id="next-btn">次スレ</button>
          <button id="close-btn">クローズ</button>
          <button id="leave-btn">閉じる(セッション終了)</button>
          <button id="rotate-btn">板鍵ローテーション</button>
        </div>
      </details>

      <details>
        <summary>モデレーション(配信者)</summary>
        <div class="row"><label for="ban-key">板鍵 BAN</label>
          <input id="ban-key" type="text" size="40" placeholder="板鍵 pubkey hex">
          <button id="ban-btn">BAN</button><button id="unban-btn">解除</button></div>
        <div class="row"><label for="connban-addr">接続 BAN</label>
          <input id="connban-addr" type="text" size="24" placeholder="ip:port">
          <button id="connban-btn">ConnBan</button><button id="unconnban-btn">解除</button></div>
      </details>

      <details>
        <summary>板設定を変更(配信者)</summary>
        <div class="row"><label for="s-title">タイトル</label><input id="s-title" type="text" size="40"></div>
        <div class="row"><label for="s-noname">名無し名</label><input id="s-noname" type="text" size="24"></div>
        <div class="row"><label for="s-reslimit">レス上限</label><input id="s-reslimit" type="number" min="100" max="4000"></div>
        <div class="row"><label for="s-pow">初回PoW</label><input id="s-pow" type="number" min="0" max="32"></div>
        <div class="row"><label for="s-rules">ルール</label></div>
        <div class="row"><textarea id="s-rules" rows="4" placeholder="ローカルルール(Markdown)"></textarea></div>
        <div class="row"><button id="settings-btn">設定を保存</button> <span id="settings-status" class="muted"></span></div>
      </details>
    </section>
  </div>

  <div id="popup" class="popup" hidden></div>

  <noscript>この画面は JavaScript を利用します。</noscript>
  <script>
    'use strict';
    // =====================================================================
    // 状態・共通ヘルパ(トークン取得・api()・エスケープは 006 を温存)
    // =====================================================================
    let token = null;
    let pollTimer = null;           // スレページの 8 秒ポーリング(FR-006)
    let current = null;             // { board, key, showAll, res, resByNo, maxResNo, summary }

    async function loadToken() {
      const res = await fetch('/api/v1/token');
      if (!res.ok) throw new Error('token');
      token = (await res.json()).token;
    }

    function escHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function shortId(id) { return id ? id.substring(0, 12) + '…' : ''; }

    async function api(method, path, body) {
      const opts = { method, headers: {} };
      if (method !== 'GET') opts.headers['X-Api-Token'] = token;
      if (body !== undefined) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      return fetch('/api/v1' + path, opts);
    }

    // 伝統形式の日付(YYYY/MM/DD(曜) HH:MM:SS — ローカル時刻)。
    function fmtDate(sec) {
      if (!sec && sec !== 0) return '';
      const d = new Date(sec * 1000);
      const w = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())}(${w}) ` +
             `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }

    // 本文の安全描画(FR-005): テキストエスケープ後に URL 自動リンク・>>n アンカー化・改行→<br>。
    // innerHTML への生値挿入はしない(全て escHtml を通した後にのみ装飾する)。
    function renderBody(raw) {
      let s = escHtml(raw);
      // http(s) URL(既存挙動)。エスケープ済み文字列上で処理する(< や " は既に実体参照)。
      s = s.replace(/(https?:\/\/[^\s<]+)/g,
        m => `<a href="${m}" target="_blank" rel="noopener noreferrer nofollow">${m}</a>`);
      // >>n アンカー(エスケープ後は > が &gt;)。data-n を持たせ、解決はクリック/ホバーで行う。
      s = s.replace(/(?:&gt;){2}(\d{1,6})/g,
        (m, n) => `<a class="anchor" data-n="${n}">&gt;&gt;${n}</a>`);
      s = s.replace(/\n/g, '<br>');
      return s;
    }

    // =====================================================================
    // ルーティング(T006 — #/ 板選択・#/board/{id} 板ページ・#/thread/{id}/{key} スレページ)
    // =====================================================================
    function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
    function hidePopup() { const p = document.getElementById('popup'); p.hidden = true; p.innerHTML = ''; }

    function showView(id) {
      for (const v of ['view-home', 'view-board', 'view-thread']) {
        document.getElementById(v).hidden = (v !== id);
      }
      hidePopup();
    }

    async function route() {
      stopPolling();
      const hash = location.hash || '#/';
      const mThread = hash.match(/^#\/thread\/([0-9a-fA-F]+)\/([^/]+)$/);
      const mBoard = hash.match(/^#\/board\/([0-9a-fA-F]+)$/);
      if (mThread) {
        showView('view-thread');
        await renderThread(mThread[1], decodeURIComponent(mThread[2]));
      } else if (mBoard) {
        showView('view-board');
        await renderBoard(mBoard[1]);
      } else {
        showView('view-home');
        await renderHome();
      }
    }

    // =====================================================================
    // ビュー1: 板選択(#/)
    // =====================================================================
    async function loadChannels() {
      const sel = document.getElementById('open-channel');
      // 二重描画を避けるため既存 option をクリア(先頭のプレースホルダのみ残す)。
      sel.length = 1;
      try {
        const res = await fetch('/api/v1/announced');
        if (!res.ok) return;
        const data = await res.json();
        for (const ch of (data.channels ?? [])) {
          if (ch.state === 'ended') continue;
          const opt = document.createElement('option');
          opt.value = ch.channel_id;            // 30311 の d タグ(guid hex32)
          opt.textContent = (ch.name || '(無題)') + ' — ' + shortId(ch.channel_id);
          sel.appendChild(opt);
        }
      } catch (_) {}
    }

    async function fetchThreads() {
      const res = await fetch('/api/v1/livechat/threads');
      if (!res.ok) return null;
      return res.json();
    }

    async function renderHome() {
      await loadChannels();
      const statusEl = document.getElementById('home-status');
      const list = document.getElementById('board-list');
      list.innerHTML = '';
      const threads = await fetchThreads();
      if (threads === null) { statusEl.textContent = 'エラー: 一覧を取得できません'; return; }
      if (threads.length === 0) { statusEl.textContent = '板はありません。'; return; }
      statusEl.textContent = '';
      for (const t of threads) {
        const li = document.createElement('li');
        const badge = t.is_local
          ? '<span class="badge-local">[自板]</span>'
          : '<span class="badge-remote">[他ノード]</span>';
        // 自板はそのまま板ページへ。他ノード板は join(常駐セッション起動)してから板ページへ。
        const link = t.is_local
          ? `<a href="#/board/${encodeURIComponent(t.board_id)}">${escHtml(t.title)}</a>`
          : `<a href="#" class="join-link" data-b="${escHtml(t.board_id)}">${escHtml(t.title)}</a>`;
        li.innerHTML = `${badge} ${link} ` +
          `<span class="muted">(${t.res_count} レス / ${escHtml(t.tip)})</span>`;
        list.appendChild(li);
      }
      list.querySelectorAll('.join-link').forEach(a =>
        a.addEventListener('click', async (e) => {
          e.preventDefault();
          await joinThenBoard(a.dataset.b);
        }));
    }

    async function joinThenBoard(board) {
      const r = await api('POST', `/livechat/threads/${board}/join`);
      if (r.status === 204) {
        // 接続直後は供給が始まっていないことがあるが、板ページ側でリトライ導線を出す。
        setTimeout(() => { location.hash = '#/board/' + encodeURIComponent(board); }, 300);
      } else {
        alert('スレを開けません: ' + r.status);
      }
    }

    document.getElementById('open-btn').addEventListener('click', async () => {
      const channel_id = document.getElementById('open-channel').value;
      const title = document.getElementById('open-title').value;
      const st = document.getElementById('open-status');
      if (!channel_id) { st.textContent = 'チャンネルを選択してください'; return; }
      const r = await api('POST', '/livechat/threads', { channel_id, title: title || null });
      if (r.status === 201) {
        const j = await r.json();
        st.textContent = '開設しました';
        location.hash = '#/board/' + encodeURIComponent(j.board_id);
      } else {
        st.textContent = 'エラー: ' + r.status;
      }
    });

    // =====================================================================
    // ビュー2: 板ページ(#/board/{id})
    // =====================================================================
    async function renderBoard(board) {
      const threads = await fetchThreads() ?? [];
      const summary = threads.find(t => t.board_id === board) || null;

      const res = await fetch('/api/v1/livechat/threads/' + board);
      const titleEl = document.getElementById('board-title');
      const badgeEl = document.getElementById('board-badge');
      const idEl = document.getElementById('board-idlabel');
      const rulesWrap = document.getElementById('board-rules-wrap');
      const urlWrap = document.getElementById('board-url-wrap');
      const listEl = document.getElementById('thread-list');
      const statusEl = document.getElementById('board-status');
      const newWrap = document.getElementById('newthread-wrap');
      listEl.innerHTML = '';
      idEl.textContent = shortId(board);
      badgeEl.innerHTML = (summary && summary.is_local)
        ? '<span class="badge-local">自板</span>' : '<span class="badge-remote">他ノード板</span>';

      if (!res.ok) {
        titleEl.textContent = summary ? summary.title : board;
        rulesWrap.hidden = true;
        urlWrap.hidden = true;
        newWrap.hidden = true;
        statusEl.innerHTML = 'まだ取得できていません。' +
          '<button id="board-retry">再取得</button>';
        document.getElementById('board-retry').addEventListener('click', () => renderBoard(board));
        return;
      }
      const d = await res.json();
      statusEl.textContent = '';
      titleEl.textContent = d.settings.title || (summary ? summary.title : board);

      // ローカルルール掲示(サーバが安全 HTML 化済み — そのまま挿入してよい・FR-005)。
      if (d.settings.local_rules_html) {
        document.getElementById('board-rules').innerHTML = d.settings.local_rules_html;
        rulesWrap.hidden = false;
      } else {
        rulesWrap.hidden = true;
      }

      // 専ブラ向け板 URL(location.hostname + compat_bbs_port を動的生成・null 時は非表示)。
      const url = boardUrl(board, d.compat_bbs_port);
      if (url) {
        document.getElementById('board-url').textContent = url;
        urlWrap.hidden = false;
      } else {
        urlWrap.hidden = true;
      }

      // スレ一覧: この板の現行スレ(1 行)。{連番}: {タイトル} ({確定レス数})。
      const key = summary ? String(summary.generation) : '1';
      const li = document.createElement('li');
      li.innerHTML = `<a href="#/thread/${encodeURIComponent(board)}/${encodeURIComponent(key)}">` +
        `${escHtml(d.settings.title || (summary ? summary.title : board))}</a> ` +
        `<span class="rescount">(${d.res.length})</span>`;
      listEl.appendChild(li);

      // 新規スレ作成欄(自板のみ — 掲載チャンネルへ open_thread する)。
      if (summary && summary.is_local && summary.channel) {
        newWrap.hidden = false;
        const btn = document.getElementById('nt-btn');
        btn.onclick = async () => {
          const title = document.getElementById('nt-title').value;
          const st = document.getElementById('nt-status');
          // channel は "30311:<pubkey>:<guid>" 形式。open_thread は d タグ(guid)を要求する。
          const parts = summary.channel.split(':');
          const channel_id = parts[parts.length - 1];
          const r = await api('POST', '/livechat/threads', { channel_id, title: title || null });
          if (r.status === 201) {
            const j = await r.json();
            st.textContent = '作成しました';
            location.hash = '#/thread/' + encodeURIComponent(j.board_id) + '/' + encodeURIComponent(j.generation);
          } else {
            st.textContent = 'エラー: ' + r.status;
          }
        };
      } else {
        newWrap.hidden = true;
      }
    }

    function boardUrl(board, port) {
      if (port === null || port === undefined) return null;
      return `http://${location.hostname}:${port}/${board}/`;
    }

    document.getElementById('copy-url-btn').addEventListener('click', () => {
      const url = document.getElementById('board-url').textContent;
      navigator.clipboard.writeText(url).then(
        () => { document.getElementById('copy-url-btn').textContent = 'コピー済'; },
        () => {});
    });

    // =====================================================================
    // ビュー3: スレページ(#/thread/{id}/{key})
    // =====================================================================
    async function renderThread(board, key) {
      current = { board, key, showAll: (current && current.board === board) ? current.showAll : false,
                  res: [], resByNo: {}, maxResNo: 0, summary: null };
      document.getElementById('thread-back').setAttribute('href', '#/board/' + encodeURIComponent(board));
      await refreshThread();
      // 8 秒ポーリングで確定反映を追従(FR-006)。
      pollTimer = setInterval(refreshThread, 8000);
    }

    async function refreshThread() {
      if (!current) return;
      const board = current.board;
      const threads = await fetchThreads() ?? [];
      current.summary = threads.find(t => t.board_id === board) || current.summary;

      const res = await fetch('/api/v1/livechat/threads/' + board);
      const listEl = document.getElementById('res-list');
      const titleEl = document.getElementById('thread-title');
      const badgeEl = document.getElementById('thread-badge');
      if (!res.ok) {
        titleEl.textContent = current.summary ? current.summary.title : board;
        badgeEl.innerHTML = '';
        listEl.innerHTML = '<div class="muted">まだ取得できていません。「更新」を押してください。</div>';
        return;
      }
      const d = await res.json();
      titleEl.textContent = d.settings.title || (current.summary ? current.summary.title : board);
      badgeEl.innerHTML = (current.summary && current.summary.is_local)
        ? '<span class="badge-local">自板</span>' : '<span class="badge-remote">他ノード板</span>';

      // 確定レスとアンカー解決用の索引を作る(欠番は詰めない = res_no をキーにする)。
      current.res = d.res;
      current.pending = d.pending ?? [];
      current.resByNo = {};
      current.maxResNo = 0;
      for (const r of d.res) {
        current.resByNo[r.res_no] = r;
        if (r.res_no > current.maxResNo) current.maxResNo = r.res_no;
      }
      // 設定フォームへ現在値を反映。
      document.getElementById('s-title').value = d.settings.title || '';
      document.getElementById('s-noname').value = d.settings.noname_name || '';
      document.getElementById('s-reslimit').value = d.settings.res_limit || 1000;
      document.getElementById('s-pow').value = d.settings.first_post_pow_bits ?? 20;
      document.getElementById('s-rules').value = d.settings.local_rules || '';

      renderResList();
    }

    // レス列の描画(既定は最新 50 / 「全部読む」で全件 — クライアント側スライス・T008)。
    function renderResList() {
      const listEl = document.getElementById('res-list');
      const rangeEl = document.getElementById('thread-range');
      listEl.innerHTML = '';
      const all = current.res;
      const L50 = 50;
      const showAll = current.showAll || all.length <= L50;
      const shown = showAll ? all : all.slice(all.length - L50);
      rangeEl.textContent = showAll
        ? `全 ${all.length} レス`
        : `最新 ${shown.length} / 全 ${all.length} レス`;
      document.getElementById('view-l50-btn').disabled = !showAll ? true : false;
      document.getElementById('view-all-btn').disabled = showAll ? true : false;

      for (const r of shown) {
        listEl.appendChild(resNode(r));
      }
      // 送信中(未確定)の自分の投稿(FR-008)。res_no を持たないため末尾に別表示。
      for (const p of (current.pending ?? [])) {
        const div = document.createElement('div');
        div.className = 'res res-pending';
        div.innerHTML = `<div class="res-head"><span class="res-no">—</span> ：` +
          `<span class="res-name">${escHtml(p.name)}</span>` +
          `${p.mail ? ' <span class="res-mail">[' + escHtml(p.mail) + ']</span>' : ''}</div>` +
          `<div class="res-body">${renderBody(p.body)}(送信中)</div>`;
        listEl.appendChild(div);
      }
    }

    // 確定レス 1 件の DOM(伝統形式ヘッダ + 本文)。id="res-{n}" を付与(アンカージャンプ先)。
    // 注: 投稿者 ID(2ch の ID:xxxx)は板詳細 JSON に含まれない(板鍵を UI へ露出しない方針)ため
    // ヘッダは `{res_no} ：{名前}：{日付}` とする(dat 側の ID は互換 API が別途生成)。
    function resNode(r) {
      const div = document.createElement('div');
      div.className = 'res';
      div.id = 'res-' + r.res_no;
      const mail = r.mail ? ` <span class="res-mail">[${escHtml(r.mail)}]</span>` : '';
      div.innerHTML =
        `<div class="res-head"><span class="res-no">${r.res_no}</span> ：` +
        `<span class="res-name">${escHtml(r.name)}</span>${mail} ：` +
        `<span class="res-date">${escHtml(fmtDate(r.created_at))}</span></div>` +
        `<div class="res-body">${renderBody(r.body)}</div>`;
      return div;
    }

    document.getElementById('view-all-btn').addEventListener('click', () => {
      current.showAll = true; renderResList();
    });
    document.getElementById('view-l50-btn').addEventListener('click', () => {
      current.showAll = false; renderResList();
    });
    document.getElementById('refresh-btn').addEventListener('click', refreshThread);

    // --- >>n アンカー(T009): クリックでジャンプ / ホバーでポップアップ / 解決不能を明示 ---
    // 参照先の解決結果を返す。status: 'ok' | 'unresolved'。
    function resolveAnchor(n) {
      if (!current || n < 1 || n > current.maxResNo) {
        return { status: 'unresolved', reason: '範囲外' };
      }
      const r = current.resByNo[n];
      if (!r) return { status: 'unresolved', reason: '未確定・欠番' };
      return { status: 'ok', res: r };
    }

    // res-list 内のアンカー操作をイベント委譲で処理する。
    const resListEl = document.getElementById('res-list');
    resListEl.addEventListener('click', (e) => {
      const a = e.target.closest('.anchor');
      if (!a) return;
      e.preventDefault();
      const n = parseInt(a.dataset.n, 10);
      const r = resolveAnchor(n);
      if (r.status !== 'ok') { showPopupText(a, `>>${n} は解決できません(${r.reason})`); return; }
      // 範囲外表示(最新50 のみ表示中で対象が隠れている)なら全件表示へ切替えてからジャンプ。
      let el = document.getElementById('res-' + n);
      if (!el && !current.showAll) { current.showAll = true; renderResList(); el = document.getElementById('res-' + n); }
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.style.background = '#fffab0';
                setTimeout(() => { el.style.background = ''; }, 1200); }
    });
    resListEl.addEventListener('mouseover', (e) => {
      const a = e.target.closest('.anchor');
      if (!a) return;
      const n = parseInt(a.dataset.n, 10);
      const r = resolveAnchor(n);
      if (r.status === 'ok') {
        showPopupHtml(a, resNode(r.res).innerHTML);
      } else {
        a.classList.add('dead');
        showPopupText(a, `>>${n} 解決不能(${r.reason})`);
      }
    });
    resListEl.addEventListener('mouseout', (e) => {
      if (e.target.closest('.anchor')) hidePopup();
    });

    function popupAt(anchorEl) {
      const p = document.getElementById('popup');
      const rect = anchorEl.getBoundingClientRect();
      p.style.left = (window.scrollX + rect.left) + 'px';
      p.style.top = (window.scrollY + rect.bottom + 4) + 'px';
      p.hidden = false;
      return p;
    }
    function showPopupHtml(anchorEl, html) { popupAt(anchorEl).innerHTML = html; }
    function showPopupText(anchorEl, text) { popupAt(anchorEl).innerHTML = `<span class="err">${escHtml(text)}</span>`; }

    // --- 書き込み(既存 POST .../write・202 受理 — FR-003) ---
    document.getElementById('write-btn').addEventListener('click', async () => {
      if (!current) return;
      const body = document.getElementById('w-body').value;
      const st = document.getElementById('write-status');
      if (!body) { st.textContent = '本文を入力してください'; return; }
      const r = await api('POST', `/livechat/threads/${current.board}/write`, {
        name: document.getElementById('w-name').value || null,
        mail: document.getElementById('w-mail').value || null,
        body,
      });
      if (r.status === 202) {
        st.textContent = '送信しました(送信中 → 確定を待ちます)';
        document.getElementById('w-body').value = '';
        setTimeout(refreshThread, 500);
      } else {
        st.textContent = 'エラー: ' + r.status;
      }
    });

    // --- スレ操作(next/close/leave/rotate) ---
    document.getElementById('next-btn').addEventListener('click', async () => {
      if (!current) return;
      const r = await api('POST', `/livechat/threads/${current.board}/next`);
      if (r.ok) refreshThread(); else alert('次スレ操作に失敗: ' + r.status);
    });
    document.getElementById('close-btn').addEventListener('click', async () => {
      if (!current) return;
      if (!confirm('スレをクローズしますか?(データは揮発します)')) return;
      const r = await api('POST', `/livechat/threads/${current.board}/close`);
      if (r.status === 204) { location.hash = '#/'; } else alert('クローズに失敗: ' + r.status);
    });
    document.getElementById('leave-btn').addEventListener('click', async () => {
      if (!current) return;
      await api('POST', `/livechat/threads/${current.board}/leave`);
      location.hash = '#/';
    });
    document.getElementById('rotate-btn').addEventListener('click', async () => {
      if (!current) return;
      const r = await api('POST', `/livechat/boards/${current.board}/rotate-key`);
      if (r.ok) { const j = await r.json(); alert('新しい板鍵: ' + j.pubkey); }
      else alert('ローテーションに失敗: ' + r.status);
    });

    // --- モデレーション ---
    async function moderate(path, body, okMsg) {
      if (!current) return;
      const r = await api('POST', `/livechat/threads/${current.board}/${path}`, body);
      alert(r.status === 204 ? okMsg : ('失敗: ' + r.status));
    }
    document.getElementById('ban-btn').addEventListener('click', () =>
      moderate('ban', { target: document.getElementById('ban-key').value }, 'BAN しました'));
    document.getElementById('unban-btn').addEventListener('click', () =>
      moderate('unban', { target: document.getElementById('ban-key').value }, 'BAN 解除しました'));
    document.getElementById('connban-btn').addEventListener('click', () =>
      moderate('connban', { target: document.getElementById('connban-addr').value }, 'ConnBan しました'));
    document.getElementById('unconnban-btn').addEventListener('click', () =>
      moderate('unconnban', { target: document.getElementById('connban-addr').value }, 'ConnBan 解除しました'));

    // --- 板設定変更 ---
    document.getElementById('settings-btn').addEventListener('click', async () => {
      if (!current) return;
      const st = document.getElementById('settings-status');
      const r = await api('PUT', `/livechat/threads/${current.board}/settings`, {
        title: document.getElementById('s-title').value,
        noname_name: document.getElementById('s-noname').value,
        res_limit: parseInt(document.getElementById('s-reslimit').value, 10),
        local_rules: document.getElementById('s-rules').value,
        first_post_pow_bits: parseInt(document.getElementById('s-pow').value, 10),
      });
      if (r.status === 204) { st.textContent = '保存しました'; refreshThread(); }
      else st.textContent = 'エラー: ' + r.status;
    });

    // =====================================================================
    // 起動
    // =====================================================================
    window.addEventListener('hashchange', route);
    (async () => {
      try { await loadToken(); } catch (_) {}
      // 供給元未配線・機能無効の検知(一覧が取得できないケースを軽く提示)。
      try {
        const probe = await fetch('/api/v1/livechat/threads');
        if (!probe.ok) document.getElementById('disabled-banner').hidden = false;
      } catch (_) { document.getElementById('disabled-banner').hidden = false; }
      await route();
    })();
  </script>
</body>
</html>
